<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Matrix | Decentralized GRAM Matrix</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: #0f131c;
            --card-border: #1a2233;
            --accent-purple: #7928ca;
            --accent-cyan: #00dfd8;
            --text-main: #f3f4f6;
            --text-muted: #8e9bb0;
            --green-node: #10b981;
            --empty-node: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
        }

        .logo-orbit {
            color: var(--accent-cyan);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-stats-pill {
            background: #141a29;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid var(--card-border);
            display: flex;
            gap: 8px;
        }

        .user-stats-pill b {
            color: var(--accent-cyan);
        }

        .wallet-btn {
            background: linear-gradient(135deg, var(--accent-purple), #4338ca);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        .banner-card {
            background: linear-gradient(180deg, #131927 0%, var(--card-bg) 100%);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            margin-top: 15px;
        }

        .banner-info h2 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .banner-info p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .banner-info b {
            color: var(--accent-cyan);
        }

        .currency-selector {
            margin-top: 15px;
        }

        .currency-selector label {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
        }

        .toggle-group {
            display: flex;
            gap: 6px;
            background: #090c14;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .curr-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            flex: 1;
            transition: 0.2s;
        }

        .curr-btn.active {
            background: var(--accent-purple);
            color: #fff;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 15px;
        }

        .section-title h3 {
            font-size: 14px;
        }

        .fee-badge {
            background: #172033;
            color: var(--accent-cyan);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
            border: 1px solid rgba(0, 223, 216, 0.2);
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 768px) {
            .slots-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .slot-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .slot-tier {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .slot-cost {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin: 8px 0;
        }

        .matrix-nodes {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
        }

        .node {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--empty-node);
            border: 1px solid #334155;
        }

        .node.filled {
            background-color: var(--green-node);
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
        }

        .recycle-text {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .buy-slot-btn {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: none;
            background: #192236;
            color: #fff;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        .buy-slot-btn:hover {
            background: var(--accent-purple);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 999;
        }

        .modal-box {
            background: #0f1422;
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 14px;
            width: 100%;
            max-width: 320px;
        }

        .modal-box h4 {
            margin-bottom: 12px;
            color: var(--text-main);
            font-size: 15px;
        }

        .modal-details p {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .modal-details span {
            color: #fff;
            font-weight: 600;
        }

        .modal-details hr {
            border: 0;
            border-top: 1px solid var(--card-border);
            margin: 10px 0;
        }

        .total-text span {
            color: var(--accent-cyan) !important;
            font-size: 15px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .btn-cancel, .btn-confirm {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-cancel {
            background: #20293a;
            color: #fff;
        }

        .btn-confirm {
            background: var(--accent-cyan);
            color: #07090e;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo"><span class="logo-orbit">ORBIT</span> MATRIX</div>
        <div class="header-right">
            <div class="user-stats-pill">
                <span>Profit: <b>128.5 GRAM</b></span>
            </div>
            <button class="wallet-btn" id="connect-wallet">Connect</button>
        </div>
    </header>

    <main class="container">
        <section class="banner-card">
            <div class="banner-info">
                <h2>100% RECYCLE MATRIX</h2>
                <p>সব লেনদেন ও আয় <b>GRAM</b> নেটওয়ার্কে জমা হয়।</p>
            </div>
            <div class="currency-selector">
                <label>পেমেন্ট মেথড সিলেক্ট করুন:</label>
                <div class="toggle-group">
                    <button class="curr-btn active" data-currency="POP">POP (0.8 GRAM Fee)</button>
                    <button class="curr-btn" data-currency="GRAM">GRAM (1.0 Fee)</button>
                    <button class="curr-btn" data-currency="USDT">USDT (1.0 Fee)</button>
                </div>
            </div>
        </section>

        <div class="section-title">
            <h3>SLOTS (10 TIERS)</h3>
            <span class="fee-badge" id="fee-display">ফি: 0.8 GRAM</span>
        </div>

        <div class="slots-grid" id="slots-container"></div>
    </main>

    <div class="modal-overlay" id="purchase-modal">
        <div class="modal-box">
            <h4>স্লট কনফার্মেশন</h4>
            <div class="modal-details">
                <p>স্লট নম্বর: <span id="modal-slot-id">#1</span></p>
                <p>মূল্য: <span id="modal-slot-price">2 GRAM</span></p>
                <p>মেথড: <span id="modal-currency">POP</span></p>
                <p>ডেভ ফি: <span id="modal-dev-fee">0.8 GRAM</span></p>
                <hr>
                <p class="total-text">মোট: <span id="modal-total-amount">2.8 GRAM</span></p>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">বাতিল</button>
                <button class="btn-confirm" onclick="confirmPurchase()">কিনুন</button>
            </div>
        </div>
    </div>

    <script>
        const slotTiers = [
            { id: 1, gramPrice: 2 },
            { id: 2, gramPrice: 4 },
            { id: 3, gramPrice: 8 },
            { id: 4, gramPrice: 16 },
            { id: 5, gramPrice: 32 },
            { id: 6, gramPrice: 64 },
            { id: 7, gramPrice: 128 },
            { id: 8, gramPrice: 250 },
            { id: 9, gramPrice: 500 },
            { id: 10, gramPrice: 1000 }
        ];

        let selectedCurrency = "POP";
        let currentDevFee = 0.8;
        let currentSelectedSlot = null;

        function renderSlots() {
            const container = document.getElementById("slots-container");
            container.innerHTML = "";
            slotTiers.forEach(slot => {
                const card = document.createElement("div");
                card.className = "slot-card";
                card.innerHTML = `
                    <div class="slot-tier">SLOT #${slot.id}</div>
                    <div class="slot-cost">${slot.gramPrice} GRAM</div>
                    <div class="matrix-nodes">
                        <div class="node filled"></div>
                        <div class="node"></div>
                        <div class="node"></div>
                    </div>
                    <div class="recycle-text">Cycles: 0 | 1/3</div>
                    <button class="buy-slot-btn" onclick="openPurchaseModal(${slot.id}, ${slot.gramPrice})">অ্যাক্টিভেট</button>
                `;
                container.appendChild(card);
            });
        }

        document.querySelectorAll(".curr-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                document.querySelectorAll(".curr-btn").forEach(b => b.classList.remove("active"));
                e.target.classList.add("active");
                selectedCurrency = e.target.getAttribute("data-currency");
                currentDevFee = selectedCurrency === "POP" ? 0.8 : 1.0;
                document.getElementById("fee-display").innerText = `ফি: ${currentDevFee.toFixed(1)} GRAM`;
            });
        });

        function openPurchaseModal(slotId, gramPrice) {
            currentSelectedSlot = { id: slotId, price: gramPrice };
            document.getElementById("modal-slot-id").innerText = `#${slotId}`;
            document.getElementById("modal-slot-price").innerText = `${gramPrice} GRAM`;
            document.getElementById("modal-currency").innerText = selectedCurrency;
            document.getElementById("modal-dev-fee").innerText = `${currentDevFee} GRAM`;
            document.getElementById("modal-total-amount").innerText = `${(gramPrice + currentDevFee).toFixed(1)} GRAM`;
            document.getElementById("purchase-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("purchase-modal").style.display = "none";
        }

        function confirmPurchase() {
            alert(`স্লট #${currentSelectedSlot.id} কেনার রিকোয়েস্ট সফল! ফি (${currentDevFee} GRAM) ডেভ ওয়ালেটে পাঠানো হচ্ছে।`);
            closeModal();
        }

        renderSlots();
    </script>
</body>
</html>
