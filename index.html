<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POP Galaxy Matrix</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- TON Connect UI -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0B0E1B; font-family: sans-serif; color: #f1f5f9; }
    .ton-btn-wrap button { width: 100% !important; border-radius: 12px !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SLOT_TIERS = [
      { id: 1, usd: 1.5 }, { id: 2, usd: 3.0 }, { id: 3, usd: 5.0 },
      { id: 4, usd: 8.0 }, { id: 5, usd: 12.0 }, { id: 6, usd: 18.0 },
      { id: 7, usd: 25.0 }, { id: 8, usd: 32.0 }, { id: 9, usd: 40.0 },
      { id: 10, usd: 50.0 }
    ];

    function App() {
      const [pricing, setPricing] = useState({ popPriceInUsdt: 0.05, usdtPriceInPop: 20.0 });
      const [referrer, setReferrer] = useState("");
      const [isActivated, setIsActivated] = useState(false);
      const [activeTab, setActiveTab] = useState("matrix");
      const [searchQuery, setSearchQuery] = useState("");
      const [searchedUser, setSearchedUser] = useState(null);
      const [userAddress, setUserAddress] = useState(null);
      const [tonConnectUI, setTonConnectUI] = useState(null);

      const [stats, setStats] = useState({
        totalPopEarned: 1845.5,
        directReferrals: 12,
        rank: "Star Commander",
        matrixRecycles: 14
      });

      const [slots, setSlots] = useState(
        SLOT_TIERS.map((tier) => ({
          ...tier,
          isActive: tier.id <= 3,
          currentNodes: tier.id <= 3 ? (tier.id * 2) % 3 : 0,
          recycles: tier.id <= 3 ? 4 - tier.id : 0
        }))
      );

      useEffect(() => {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
          const initData = window.Telegram.WebApp.initDataUnsafe;
          if (initData && initData.start_param) {
            setReferrer(initData.start_param);
          }
        }

        try {
          const tc = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-community/tutorials/main/03-client/test/public/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
          });
          setTonConnectUI(tc);
          tc.onStatusChange(wallet => {
            setUserAddress(wallet ? wallet.account.address : null);
          });
        } catch (e) {
          console.error("TonConnect error:", e);
        }

        setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 200);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, isActivated, searchedUser]);

      const handleActivateReferrer = (e) => {
        e.preventDefault();
        if (!referrer || referrer.length < 8) {
          alert("Please provide a valid TON wallet referrer address.");
          return;
        }
        setIsActivated(true);
      };

      const handleUpgradeSlot = async (slotId, requiredPop) => {
        if (!userAddress) {
          alert("Please connect your TON wallet first!");
          return;
        }
        try {
          const transaction = {
            validUntil: Math.floor(Date.now() / 1000) + 300,
            messages: [{ address: "EQBJR76LKeOC4MA113ORjgj5E3G-H8e5LT7HO6Vu-YMU2tYb", amount: "100000000", payload: "" }]
          };
          if (tonConnectUI) {
            await tonConnectUI.sendTransaction(transaction);
            setSlots((prev) => prev.map((s) => (s.id === slotId ? { ...s, isActive: true, currentNodes: 1 } : s)));
            alert("Slot #" + slotId + " successfully activated!");
          }
        } catch (err) {
          alert("Transaction canceled.");
        }
      };

      const handleSearchUser = (e) => {
        e.preventDefault();
        if (!searchQuery) return;
        setSearchedUser({
          address: searchQuery,
          earnedPop: 3420.0,
          activeSlots: 5,
          teamSize: 28,
          rank: "Galaxy Admiral"
        });
      };

      return (
        <div className="min-h-screen bg-[#0B0E1B] text-slate-100 flex flex-col items-center px-3 py-4 selection:bg-amber-400 selection:text-black">
          <header className="w-full max-w-md flex flex-col items-center mb-4">
            <h1 className="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 drop-shadow-[0_0_12px_rgba(251,191,36,0.6)]">
              POP GALAXY
            </h1>
            <p className="text-[11px] uppercase tracking-widest text-cyan-400 font-semibold mt-0.5">
              Decentralized Matrix Hub
            </p>
          </header>

          <div className="w-full max-w-md bg-amber-500/10 border border-amber-500/30 rounded-xl p-2.5 mb-4 flex items-center gap-2.5">
            <i data-lucide="shield-alert" className="w-5 h-5 text-amber-400 shrink-0"></i>
            <p className="text-[11px] leading-tight text-amber-200">
              <span className="font-bold text-amber-400">Gas Notice:</span> Keep at least 0.2 TON in your wallet to cover matrix execution fees.
            </p>
          </div>

          <div className="w-full max-w-md flex justify-center mb-5 ton-btn-wrap">
            <div id="ton-connect-btn"></div>
          </div>

          {!isActivated && (
            <div className="w-full max-w-md bg-[#0D1127] border border-cyan-500/30 rounded-2xl p-4 shadow-xl mb-6">
              <div className="flex items-center gap-2 mb-2">
                <i data-lucide="zap" className="w-5 h-5 text-amber-400"></i>
                <h2 className="text-sm font-bold tracking-wide uppercase text-white">Activate Matrix Access</h2>
              </div>
              <p className="text-xs text-slate-400 mb-3">
                POP Galaxy requires a verified upline referrer wallet address to unlock matrix participation.
              </p>
              <form onSubmit={handleActivateReferrer} className="flex flex-col gap-2.5">
                <input
                  type="text"
                  placeholder="Enter Referrer TON Address (UQ... / EQ...)"
                  value={referrer}
                  onChange={(e) => setReferrer(e.target.value)}
                  className="w-full bg-[#070913] border border-slate-700 focus:border-amber-400 rounded-lg px-3 py-2 text-xs text-slate-200 outline-none"
                />
                <button type="submit" className="w-full py-2.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-bold rounded-lg text-xs uppercase tracking-wider shadow-md shadow-amber-500/20">
                  Verify & Enter Galaxy
                </button>
              </form>
            </div>
          )}

          <section className="w-full max-w-md grid grid-cols-2 gap-2.5 mb-6">
            <div className="bg-[#0D1127] border border-slate-800 rounded-xl p-3 flex flex-col justify-between">
              <span className="text-[10px] uppercase font-bold text-slate-400 flex items-center gap-1">
                <i data-lucide="dollar-sign" className="w-3 h-3 text-cyan-400"></i> Total Earnings
              </span>
              <div className="mt-1">
                <div className="text-lg font-black text-amber-400">
                  {stats.totalPopEarned.toLocaleString()} <span className="text-xs font-semibold text-slate-400">POP</span>
                </div>
                <div className="text-[11px] font-semibold text-emerald-400">≈ $92.27 USDT</div>
              </div>
            </div>

            <div className="bg-[#0D1127] border border-slate-800 rounded-xl p-3 flex flex-col justify-between">
              <span className="text-[10px] uppercase font-bold text-slate-400 flex items-center gap-1">
                <i data-lucide="users" className="w-3 h-3 text-cyan-400"></i> Direct Fleet
              </span>
              <div className="mt-1">
                <div className="text-lg font-black text-white">{stats.directReferrals} <span className="text-xs font-semibold text-slate-400">Pilots</span></div>
                <div className="text-[11px] font-semibold text-amber-400 flex items-center gap-1">
                  <i data-lucide="award" className="w-3 h-3"></i> {stats.rank}
                </div>
              </div>
            </div>
          </section>

          <div className="w-full max-w-md flex border-b border-slate-800 mb-4 text-xs font-bold">
            <button onClick={() => setActiveTab("matrix")} className={"flex-1 py-2 text-center transition-all " + (activeTab === "matrix" ? "text-amber-400 border-b-2 border-amber-400" : "text-slate-500")}>
              Matrix Tiers
            </button>
            <button onClick={() => setActiveTab("explorer")} className={"flex-1 py-2 text-center transition-all " + (activeTab === "explorer" ? "text-amber-400 border-b-2 border-amber-400" : "text-slate-500")}>
              Fleet Explorer
            </button>
            <button onClick={() => setActiveTab("ledger")} className={"flex-1 py-2 text-center transition-all " + (activeTab === "ledger" ? "text-amber-400 border-b-2 border-amber-400" : "text-slate-500")}>
              Payout Ledger
            </button>
          </div>

          {activeTab === "matrix" && (
            <section className="w-full max-w-md grid grid-cols-2 gap-3 mb-8">
              {slots.map((slot) => {
                const requiredPop = (slot.usd * pricing.usdtPriceInPop).toFixed(1);
                return (
                  <div key={slot.id} className={"relative rounded-xl border p-3.5 flex flex-col justify-between transition-all " + (slot.isActive ? "bg-[#0D1127] border-cyan-500/40 shadow-lg shadow-cyan-950/20" : "bg-[#090C18]/60 border-slate-800/80 opacity-70")}>
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-black tracking-wide text-amber-400">SLOT #{slot.id}</span>
                      <span className={"text-[9px] font-extrabold uppercase px-1.5 py-0.5 rounded " + (slot.isActive ? "bg-cyan-500/20 text-cyan-300" : "bg-slate-800 text-slate-500")}>
                        {slot.isActive ? "ACTIVE" : "LOCKED"}
                      </span>
                    </div>

                    <div className="mb-3">
                      <div className="text-sm font-black text-white">${slot.usd.toFixed(2)}</div>
                      <div className="text-[10px] text-slate-400 font-medium">≈ {requiredPop} POP</div>
                    </div>

                    <div className="flex justify-center items-center gap-2 my-2 py-1.5 bg-[#060811] rounded-lg border border-slate-800/60">
                      {[0, 1, 2].map((nodeIdx) => (
                        <div key={nodeIdx} className={"w-3.5 h-3.5 rounded-full border transition-all " + (nodeIdx < slot.currentNodes ? "bg-amber-400 border-amber-300 shadow-[0_0_8px_rgba(251,191,36,0.7)]" : "bg-slate-900 border-slate-700")} />
                      ))}
                    </div>

                    <div className="flex items-center justify-between mt-2 pt-2 border-t border-slate-800/60">
                      <div className="text-[10px] text-slate-400 flex items-center gap-1 font-mono">
                        <i data-lucide="refresh-cw" className="w-3 h-3 text-cyan-400"></i>
                        <span>{slot.recycles}</span>
                      </div>
                      {!slot.isActive ? (
                        <button onClick={() => handleUpgradeSlot(slot.id, requiredPop)} className="px-2.5 py-1 bg-amber-400 hover:bg-amber-300 text-slate-950 text-[10px] font-bold rounded uppercase tracking-wider">
                          Unlock
                        </button>
                      ) : (
                        <span className="text-[9px] text-emerald-400 font-bold uppercase">Online</span>
                      )}
                    </div>
                  </div>
                );
              })}
            </section>
          )}

          {activeTab === "explorer" && (
            <section className="w-full max-w-md flex flex-col gap-4">
              <form onSubmit={handleSearchUser} className="flex gap-2">
                <input
                  type="text"
                  placeholder="Search by wallet (EQ... / UQ...)"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="flex-1 bg-[#0D1127] border border-slate-800 focus:border-cyan-400 rounded-lg px-3 py-2 text-xs text-slate-200 outline-none"
                />
                <button type="submit" className="bg-cyan-500 hover:bg-cyan-400 px-3.5 rounded-lg text-slate-950 font-bold flex items-center justify-center">
                  <i data-lucide="search" className="w-4 h-4"></i>
                </button>
              </form>

              {searchedUser && (
                <div className="bg-[#0D1127] border border-cyan-500/30 rounded-xl p-4 flex flex-col gap-3">
                  <div className="text-xs font-mono text-cyan-300 truncate">Address: {searchedUser.address}</div>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div className="bg-[#070913] p-2.5 rounded-lg">
                      <div className="text-slate-400 text-[10px]">Rank</div>
                      <div className="font-bold text-amber-400">{searchedUser.rank}</div>
                    </div>
                    <div className="bg-[#070913] p-2.5 rounded-lg">
                      <div className="text-slate-400 text-[10px]">Active Slots</div>
                      <div className="font-bold text-white">{searchedUser.activeSlots} / 10</div>
                    </div>
                    <div className="bg-[#070913] p-2.5 rounded-lg">
                      <div className="text-slate-400 text-[10px]">Fleet Members</div>
                      <div className="font-bold text-white">{searchedUser.teamSize}</div>
                    </div>
                    <div className="bg-[#070913] p-2.5 rounded-lg">
                      <div className="text-slate-400 text-[10px]">Total POP Earned</div>
                      <div className="font-bold text-emerald-400">{searchedUser.earnedPop} POP</div>
                    </div>
                  </div>
                </div>
              )}
            </section>
          )}

          {activeTab === "ledger" && (
            <section className="w-full max-w-md bg-[#0D1127] border border-slate-800 rounded-xl p-3">
              <div className="text-xs font-bold uppercase text-slate-400 mb-3 flex items-center gap-1.5">
                <i data-lucide="layers" className="w-3.5 h-3.5 text-amber-400"></i> Weekly Distribution Pipeline
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-[11px]">
                  <thead>
                    <tr className="border-b border-slate-800 text-slate-500">
                      <th className="pb-2">Date</th>
                      <th className="pb-2">Type</th>
                      <th className="pb-2">POP Paid</th>
                      <th className="pb-2 text-right">USDT Value</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60 font-mono">
                    <tr>
                      <td className="py-2 text-slate-400">Today</td>
                      <td className="py-2 text-cyan-400">L1 Split</td>
                      <td className="py-2 text-white">40.0 POP</td>
                      <td className="py-2 text-right text-emerald-400 font-bold">$2.00</td>
                    </tr>
                    <tr>
                      <td className="py-2 text-slate-400">Oct 01</td>
                      <td className="py-2 text-amber-400">Weekly Auto</td>
                      <td className="py-2 text-white">620.0 POP</td>
                      <td className="py-2 text-right text-emerald-400 font-bold">$31.00</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          )}

          <footer className="mt-auto pt-6 text-[10px] text-slate-600 tracking-wider">
            POP GALAXY MATRIX &copy; 2026 • TON BLOCKCHAIN POWERED
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
